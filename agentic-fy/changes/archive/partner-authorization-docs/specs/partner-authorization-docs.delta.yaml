# Spec delta for the "partner-authorization-docs" capability.
# Reference requirements by their stable id. Operations: add | modify | remove.
capability: partner-authorization-docs

purpose: >
  Documentação estática (HTML/CSS) do processo de autorização de parceiro do BIAM
  (PIAM), incluindo tema claro/escuro, referências normativas (RFCs) e uma área
  ilustrativa de implementação em Spring Boot com arquitetura hexagonal. Escopo restrito a
  documentação; nenhum backend executável.

operations:
  - op: add
    id: partner-authorization-flow-page
    title: Página do processo de autorização de parceiro
    statement: >
      A documentação SHALL apresentar uma página descrevendo o processo de autorização de
      parceiro de ponta a ponta (identificação de tenant, autenticação via IDP, Token
      Exchange e emissão do token de aplicação com scopes e canais).
    scenarios:
      - when: o leitor abre a página de autorização de parceiro
        then: vê o fluxo E2E em etapas e um diagrama de sequência das trocas entre ator e sistema
      - when: o leitor consulta os escopos e perfis
        then: vê uma tabela de scopes por canal coerente com o modelo OLTP documentado

  - op: add
    id: dark-light-theme
    title: Alternância de tema claro/escuro
    statement: >
      O site de documentação SHALL oferecer temas claro e escuro com alternância manual,
      respeitando a preferência do sistema por padrão e persistindo a escolha do usuário.
    scenarios:
      - when: o usuário visita o site sem preferência salva
        then: o tema segue a preferência do sistema operacional (prefers-color-scheme)
      - when: o usuário aciona o botão de alternância de tema
        then: o tema muda imediatamente e a escolha é lembanka nas próximas visitas
      - when: uma página carrega com um tema salvo
        then: o tema é aplicado sem flash de cor incorreta

  - op: add
    id: rfc-references
    title: Referências normativas (RFCs)
    statement: >
      A documentação SHALL incluir referências às RFCs relevantes ao fluxo de autorização,
      com link oficial e explicação de como cada uma se aplica ao BIAM, sem reproduzir o
      texto das RFCs.
    scenarios:
      - when: o leitor consulta a seção de referências
        then: encontra ao menos RFC 6749, 6750, 7519 e 8693 com links oficiais e nota de aplicação

  - op: add
    id: hexagonal-implementation-area
    title: Área de implementação Spring Boot hexagonal (ilustrativa)
    statement: >
      A documentação SHALL apresentar uma área ilustrativa mostrando a implementação do
      processo em Spring Boot com Spring Data JPA e arquitetura hexagonal (portas e
      adaptadores), deixando claro que o conteúdo é ilustrativo e não um projeto compilável.
    scenarios:
      - when: o leitor abre a área de implementação
        then: vê a estrutura de pacotes hexagonal e exemplos de domínio, casos de uso, ports e adaptadores JPA
      - when: o leitor visualiza os exemplos de código
        then: há um aviso explícito de que o código é ilustrativo para fins de documentação

  - op: add
    id: docs-only-constraint
    title: Restrição de escopo somente documentação
    statement: >
      Este change SHALL alterar apenas artefatos de documentação (HTML, CSS, JS de UI do
      site) e NÃO SHALL introduzir backend executável, build Java/Maven, banco de dados ou
      dependências de tooling de site.
    scenarios:
      - when: os arquivos do change são revisados
        then: apenas arquivos sob docs/ (páginas, estilos e script de tema) foram criados ou modificados
